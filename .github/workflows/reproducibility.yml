name: reproducibility

# The full one-command reproduction, exactly as a reviewer would run it, plus the
# container build. Monte Carlo runs at the frozen K = 250,000.

on:
  push:
    branches: [main]
    tags: ['v*', 'preregister-*']
  workflow_dispatch:
  schedule:
    # Weekly, so bit-rot in the pinned environment surfaces on its own rather
    # than at submission time.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  reproduce:
    name: make reproduce (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # experiments record git describe / tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Generate the locales the determinism experiment exercises
        run: |
          sudo sed -i '/en_US.UTF-8/s/^# //; /de_DE.UTF-8/s/^# //; /tr_TR.UTF-8/s/^# //; /ja_JP.UTF-8/s/^# //' /etc/locale.gen
          sudo locale-gen

      - name: Full reproduction
        run: python -m experiments.reproduce_all

      - name: Verify the committed case tree is unchanged by regeneration
        run: git diff --exit-code -- cases/ catalog/ invariants/ keys/

      - name: Verify MANIFEST.sha256 is current
        # `make reproduce` rewrites results/development/ by design, so those rows
        # legitimately change and comparing them would be self-defeating. Every
        # other row must be unchanged: the released artifact, the case tree, the
        # frozen code and the reportable results.
        run: |
          # MANIFEST.json embeds every file's hash, including the development
          # results, so its own row necessarily changes too. Both are excluded;
          # everything else must match exactly.
          filter() { grep -vE '  development_result |  MANIFEST\.json$'; }
          git show HEAD:MANIFEST.sha256 | filter > /tmp/manifest_before.txt
          python -m experiments.make_manifest
          filter < MANIFEST.sha256 > /tmp/manifest_after.txt
          diff /tmp/manifest_before.txt /tmp/manifest_after.txt \
            && echo "manifest is current for every released path ($(wc -l < /tmp/manifest_after.txt) rows checked)"

      - name: Prospective-v4 freeze verification
        # Independent of the historical --final-v2/--final-v3 checks above;
        # covers Case A/B-v1.1/C, provenance, Q1-Q10, negative fixtures,
        # A1-A4, 13 injections, v1.1 determinism/Monte Carlo, and the
        # git-tree-based MANIFEST self-consistency check.
        run: python tools/freeze_check.py --prospective-v4

      - name: Show the generated summary
        run: cat results/development/SUMMARY.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-results
          path: results/
          if-no-files-found: error

  reproduce-v12:
    name: make reproduce-v12 (Paper 2 v1.2 development generators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # experiments record git describe / tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Generate the locales the determinism experiment exercises
        run: |
          sudo sed -i '/en_US.UTF-8/s/^# //; /de_DE.UTF-8/s/^# //; /tr_TR.UTF-8/s/^# //; /ja_JP.UTF-8/s/^# //' /etc/locale.gen
          sudo locale-gen

      - name: Run the v1.2 development generators
        # Mirrors `make reproduce-v12` exactly, but invoked directly (as the
        # `reproduce` job above does for `make reproduce`) since this runner
        # has no .venv for the Makefile's $(PY) to resolve to.
        run: |
          python -m experiments.surface_a_paired_validation
          python -m experiments.case_d_matrix
          python -m experiments.validate_contract_v12
          python -m experiments.audit_regression_v12
          python -m experiments.run_determinism_v12
          python -m experiments.neutrality_v12
          python -m experiments.compile_timing_v12
          python -m experiments.observation_diagnostics_v12
          python -m experiments.case_b_integration_regression_v12
          python -m experiments.monte_carlo_regression_v12
          python -m experiments.build_campaign_results_v12

      - name: Prospective-v5 freeze verification
        # Independent of --final-v2/--final-v3/--prospective-v4; covers
        # Surface A, Case D, the 16-row validator matrix, audit/Q1-Q10,
        # 93-run local determinism, GD/GDmin Monte Carlo regression, compile
        # timing, observation diagnostics, Case B integration, and full
        # pytest. Does not check environment-7 container evidence (that is
        # generated locally via Docker; see
        # experiments/check_environment_container_v12.py) unless
        # results/development_v12/environment_container_aarch64.json is
        # already present in the checkout.
        run: python tools/freeze_check.py --prospective-v5

      - name: Upload v1.2 development results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-v12-results
          path: results/development_v12/
          if-no-files-found: error

  container:
    name: docker build and reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned image
        run: docker build -t gcir .
      - name: Reproduce inside the container
        run: docker run --rm gcir make reproduce
      - name: Record the image digest
        run: docker image inspect gcir --format '{{ index .RepoDigests 0 }}{{ println }}{{ .Id }}' || docker image inspect gcir --format '{{ .Id }}'
