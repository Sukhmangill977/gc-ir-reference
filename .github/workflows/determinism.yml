name: cross-platform determinism

# Measures the claim the local determinism experiment deliberately does NOT make:
# that the compiled canonical payload hash is identical across independently
# installed host operating systems.
#
# Every runner compiles Case A and Case B and compares against the reference
# hashes committed in cases/*/expected/reference_hashes.json. A mismatch on any
# platform fails the workflow.
#
# Section XII lists cross-host replication as an outstanding threat to the
# environment-independence claim. THIS WORKFLOW IS THAT REPLICATION. Until it has
# actually passed, the supportable wording remains "deterministic under the
# declared environment" -- and even once it passes, the supportable wording is
# "deterministic across the tested supported environments", never "platform
# independent".

on:
  push:
    branches: [main]
    tags: ['v*', 'preregister-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-hashes:
    name: reference hashes (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.locale }}, ${{ matrix.tz }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
        include:
          - os: ubuntu-latest
            locale: C.UTF-8
            tz: UTC
          - os: windows-latest
            locale: C
            tz: Asia/Kolkata
          - os: macos-latest
            locale: en_US.UTF-8
            tz: Pacific/Chatham
    env:
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: RFC 8785 canonicalization conformance
        run: python -m pytest tests/unit/test_rfc8785.py -q

      - name: Verify committed reference canonical payload hashes
        run: python -m experiments.verify_hashes

      - name: Determinism experiment (frozen 31-run stratified matrix per case)
        run: python -m experiments.run_determinism --runs-per-case 31

      - name: Upload determinism run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            results/development/determinism_runs.csv
            results/development/determinism_summary.json
          if-no-files-found: error

  cross-platform-agreement:
    name: all platforms agree on the reference hashes
    needs: reference-hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Compare every platform's reference hash
        run: python -m experiments.check_ci_agreement downloaded --out CI_STATUS.md

      - name: Publish the cross-platform status table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-status
          path: CI_STATUS.md
          if-no-files-found: ignore

  # Prospective preregister-tier0-v4 state: Case A + Case B v1.1 (12 predicates,
  # 9 ACS). Kept as separate jobs from reference-hashes / cross-platform-agreement
  # above so the historical (Case A + historical Case B) evidence and workflow
  # path are never touched -- do not cite the historical v2-era cross-platform
  # run as evidence for this prospective v4 state.
  reference-hashes-case-b-v11:
    name: v4 reference hashes (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.locale }}, ${{ matrix.tz }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
        include:
          - os: ubuntu-latest
            locale: C.UTF-8
            tz: UTC
          - os: windows-latest
            locale: C
            tz: Asia/Kolkata
          - os: macos-latest
            locale: en_US.UTF-8
            tz: Pacific/Chatham
    env:
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Determinism experiment, Case A + Case B v1.1 (frozen 31-run stratified matrix per case)
        run: python -m experiments.run_determinism_case_b_v11

      - name: Upload determinism run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-case-b-v11-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            results/development/determinism_runs_case_b_v11.csv
            results/development/determinism_summary_case_b_v11.json
          if-no-files-found: error

  cross-platform-agreement-case-b-v11:
    name: all platforms agree on the v4 reference hashes (Case A + Case B v1.1)
    needs: reference-hashes-case-b-v11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Compare every platform's v4 reference hash
        run: python -m experiments.check_ci_agreement_case_b_v11 downloaded --out CI_STATUS_CASE_B_V11.md

      - name: Publish the v4 cross-platform status table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-status-case-b-v11
          path: CI_STATUS_CASE_B_V11.md
          if-no-files-found: ignore

  # Paper 2 v1.2 (development-generation; spec section 8): Case D CCS0,
  # CCS1, CCS2 (gap-audit item 3: all three closure states, not CCS1 alone).
  # Kept as its own job pair, entirely separate from reference-hashes and
  # reference-hashes-case-b-v11 above, so neither the historical nor the
  # prospective-v4 evidence or workflow path is ever touched.
  reference-hashes-case-d:
    name: v1.2 reference hashes (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.locale }}, ${{ matrix.tz }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
        include:
          - os: ubuntu-latest
            locale: C.UTF-8
            tz: UTC
          - os: windows-latest
            locale: C
            tz: Asia/Kolkata
          - os: macos-latest
            locale: en_US.UTF-8
            tz: Pacific/Chatham
    env:
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Determinism experiment, Case D CCS0/CCS1/CCS2 (frozen 31-run stratified matrix each)
        run: python -m experiments.run_determinism_v12 --cases case_d_ccs0 case_d_ccs1 case_d_ccs2 --runs-per-case 31 --phase development

      - name: Upload determinism run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-case-d-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            results/development_v12/determinism_runs.csv
            results/development_v12/determinism.json
          if-no-files-found: error

  cross-platform-agreement-case-d:
    name: all platforms agree on the Case D CCS0/CCS1/CCS2 reference hashes
    needs: reference-hashes-case-d
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Compare every platform's Case D CCS0/CCS1/CCS2 reference hashes
        run: python -m experiments.check_ci_agreement_case_d downloaded --out CI_STATUS_CASE_D.md

      - name: Publish the Case D cross-platform status table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-status-case-d
          path: CI_STATUS_CASE_D.md
          if-no-files-found: ignore
